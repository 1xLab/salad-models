name: Build Runner Images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  packages: write
  contents: read

jobs:
  build-runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Nemotron Runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nemotron-runner
          push: true
          tags: ghcr.io/1xlab/nemotron3-30b-runner:latest
          provenance: false

      - name: Build & Push Qwen Runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qwen-runner
          push: true
          tags: ghcr.io/1xlab/qwen36-35b-runner:latest
          provenance: false
