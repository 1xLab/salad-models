name: Build Model Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - '.github/workflows/build-models.yml'

permissions:
  packages: write
  contents: read

jobs:
  build-nemotron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nemotron
          push: true
          tags: ghcr.io/1xlab/nemotron3-nano-30b-a3b:latest
          provenance: false

  build-qwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qwen
          push: true
          tags: ghcr.io/1xlab/qwen36-35b-a3b:latest
          provenance: false
